<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Player</title>
		<script src="https://cdn.jsdelivr.net/npm/shaka-player@5/dist/shaka-player.ui.js"></script>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/shaka-player@5/dist/controls.css"
		/>
		<style>
			@font-face {
				font-family: "VAG Rounded Next";
				src: url("/fonts/vag-rounded-next-bold.woff2") format("woff2");
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			* {
				-webkit-tap-highlight-color: transparent;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				background: #000;
				overflow: hidden;
			}

			#player-container {
				position: relative;
				width: 100%;
				height: 100%;
				background: #000;
			}

			#video {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: contain;
			}

			#poster-cover {
				position: absolute;
				inset: 0;
				background: #000 center / contain no-repeat;
				opacity: 0;
				pointer-events: none;
				transition: opacity 0.2s ease;
			}

			#poster-cover.visible {
				opacity: 1;
			}

			.shaka-spinner-container .shaka-spinner svg g circle {
				stroke: rgba(255, 255, 255, 0.2) !important;
				stroke-opacity: 1 !important;
			}

			.shaka-spinner-container .shaka-spinner svg g path {
				stroke: rgba(224, 11, 82, 0.8) !important;
				/* Сделал чуть ярче для контраста */
				stroke-linecap: round !important;
			}

			.shaka-range-element {
				background: transparent !important;
			}

			.shaka-seek-bar-container
				.shaka-range-element::-webkit-slider-thumb {
				background: rgb(224, 11, 82) !important;
				transform: translateX(-1px);
			}

			.shaka-seek-bar-container .shaka-range-element::-moz-range-thumb {
				background: rgb(224, 11, 82) !important;
				transform: translateX(-1px);
			}

			.shaka-text-container,
			.shaka-text-container span,
			.shaka-text-container div,
			.shaka-text-container * {
				background: transparent !important;
				background-color: transparent !important;
				border-radius: 0 !important;
				box-shadow: none !important;
			}

			.shaka-text-container,
			.shaka-text-container span,
			.shaka-text-container div,
			.shaka-text-container * {
				font-family: "VAG Rounded Next", Arial, sans-serif !important;
				font-weight: 700 !important;
				color: #fff !important;
				font-size: clamp(16px, 4.8vw, 54px) !important;
				font-size: clamp(16px, min(4.8vw, 8.5vh), 54px) !important;
				line-height: 0.82 !important;
				line-height: min(0.82em, 36px) !important;
				letter-spacing: 0 !important;
				text-align: center !important;
				margin-top: 0 !important;
				margin-bottom: 0 !important;
				text-shadow:
					0 0.075em 0 #000,
					0 -0.075em 0 #000,
					0.075em 0 0 #000,
					-0.075em 0 0 #000,
					0.055em 0.055em 0 #000,
					-0.055em 0.055em 0 #000,
					0.055em -0.055em 0 #000,
					-0.055em -0.055em 0 #000,
					0 0.055em 0 #000,
					0 -0.055em 0 #000,
					0.055em 0 0 #000,
					-0.055em 0 0 #000,
					0.04em 0.04em 0 #000,
					-0.04em 0.04em 0 #000,
					0.04em -0.04em 0 #000,
					-0.04em -0.04em 0 #000,
					0 0.11em 0.22em rgba(0, 0, 0, 0.85) !important;
			}

			.shaka-text-container {
				inset: auto 6% 14% 6% !important;
				width: auto !important;
				height: auto !important;
				pointer-events: none;
			}

			.shaka-text-container span {
				display: inline !important;
				box-decoration-break: clone;
				-webkit-box-decoration-break: clone;
				border-radius: 0 !important;
				padding: 0 !important;
				white-space: pre-wrap !important;
			}

			.shaka-text-container div + div,
			.shaka-text-container span + span {
				margin-top: -0.18em !important;
			}

			video::cue {
				background: transparent;
				background-color: transparent;
				font-family: "VAG Rounded Next", Arial, sans-serif;
				font-weight: 700;
				color: #fff;
				-webkit-text-fill-color: #fff;
				font-size: clamp(16px, 4.8vw, 54px);
				font-size: clamp(16px, min(4.8vw, 8.5vh), 54px);
				line-height: 0.82;
				line-height: min(0.82em, 36px);
				text-shadow:
					0 0.075em 0 #000,
					0 -0.075em 0 #000,
					0.075em 0 0 #000,
					-0.075em 0 0 #000,
					0.055em 0.055em 0 #000,
					-0.055em 0.055em 0 #000,
					0.055em -0.055em 0 #000,
					-0.055em -0.055em 0 #000,
					0 0.055em 0 #000,
					0 -0.055em 0 #000,
					0.055em 0 0 #000,
					-0.055em 0 0 #000,
					0.04em 0.04em 0 #000,
					-0.04em 0.04em 0 #000,
					0.04em -0.04em 0 #000,
					-0.04em -0.04em 0 #000,
					0 0.11em 0.22em rgba(0, 0, 0, 0.85);
			}

			video::cue(*) {
				background: transparent;
				background-color: transparent;
				color: #fff;
				-webkit-text-fill-color: #fff;
			}

			video::-webkit-media-text-track-container {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-display {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-region {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-region-container {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-background {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			@media (max-width: 900px), (pointer: coarse) and (max-height: 500px) {
				.shaka-text-container,
				.shaka-text-container span,
				.shaka-text-container div,
				.shaka-text-container * {
					font-size: clamp(14px, 4.2vw, 24px) !important;
					font-size: clamp(14px, min(4.2vw, 6vh), 24px) !important;
					line-height: 0.95 !important;
					line-height: min(0.95em, 23px) !important;
				}

				.shaka-text-container {
					inset: auto 5% 13% 5% !important;
				}

				.shaka-text-container div + div,
				.shaka-text-container span + span {
					margin-top: -0.16em !important;
				}

				video::cue {
					background: transparent;
					background-color: transparent;
					font-size: clamp(14px, 4.2vw, 24px);
					font-size: clamp(14px, min(4.2vw, 6vh), 24px);
					line-height: 0.95;
					line-height: min(0.95em, 23px);
				}
			}

			#skip-btn {
				display: none;
				position: fixed;
				bottom: 90px;
				right: 16px;
				z-index: 100;
				gap: 10px;
			}

			#skip-btn-dismiss,
			#skip-btn-action {
				background: rgba(28, 28, 28, 0.9);
				color: #fff;
				border: none;
				border-radius: 12px;
				transition: opacity cubic-bezier(0.4, 0, 0.6, 1) 0.6s;
				padding: 5px;
				cursor: pointer;
			}

			#skip-btn-dismiss-inner,
			#skip-btn-action-inner {
				padding: 10px;
				border-radius: 12px;
				font-size: 14px;
			}

			#skip-btn.visible {
				display: flex;
			}

			#skip-btn-dismiss:hover #skip-btn-dismiss-inner,
			#skip-btn-action:hover #skip-btn-action-inner {
				background: rgba(255, 255, 255, 0.1);
			}
		</style>
	</head>

	<body>
		<div id="player-container">
			<video id="video" playsinline></video>
			<div id="poster-cover" aria-hidden="true"></div>
			<div id="skip-btn">
				<button id="skip-btn-dismiss">
					<div id="skip-btn-dismiss-inner">
						<img
							style="display: block; font-size: 16px"
							class="shaka-ui-icon"
							src="https://dcote.net/images/player-vector/file-x.svg"
						/>
					</div>
				</button>
				<button id="skip-btn-action">
					<div id="skip-btn-action-inner">Пропустить опенинг</div>
				</button>
			</div>
		</div>
		<script>
			const playerParams = new URLSearchParams(location.search);
			const localHostnamePattern =
				/^(localhost|127\.0\.0\.1|::1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/;
			const stage =
				playerParams.get("stage") ||
				(localHostnamePattern.test(location.hostname) ? "dev" : "prod");
			const backendUrl =
				stage == "dev"
					? location.origin
					: "https://video.dcote.net/metrics-api";
			const websocketUrl =
				stage == "dev"
					? `${location.protocol === "https:" ? "wss" : "ws"}://${
							location.host
						}/metrics/ws`
					: "wss://video.dcote.net/metrics-api/metrics/ws";
			const viewingTime = { watchedSeconds: 0, startTime: null };
			const viewStartedMetric = {
				sent: false,
				thresholdSeconds: 30,
				timerId: null,
			};
			const viewLabelsMetric = {
				sentKey: null,
			};
			function initViewingTime() {
				if (!viewingTime.startTime) {
					viewingTime.startTime = Date.now();
				}
				scheduleViewStartedMetricCheck();
			}
			function saveViewingTime() {
				if (viewingTime.startTime) {
					let dif = Math.floor(
						(Date.now() - viewingTime.startTime) / 1000,
					);
					viewingTime.watchedSeconds += dif;
					viewingTime.startTime = null;
				}
				updateViewStartedMetricState();
			}
			function getViewingTimeSeconds() {
				const activeSeconds = viewingTime.startTime
					? Math.floor((Date.now() - viewingTime.startTime) / 1000)
					: 0;
				return viewingTime.watchedSeconds + activeSeconds;
			}
			const metricDatas = {
				season: null,
				episode: null,
				voice: null,
			};
			let metricPlayer = null;
			let metricVideo = null;
			const subtitleMetric = {
				activeSeconds: 0,
				activeStartedAt: null,
				sent: false,
				thresholdSeconds: 30,
				timerId: null,
			};
			function normalizeMetricLabel(value) {
				if (typeof value !== "string") return null;
				const label = value.trim().replace(/\s+/g, " ");
				return label ? label.slice(0, 80) : null;
			}
			function getSelectedVoice(player) {
				if (!player) return null;
				const audioTracks =
					typeof player.getAudioTracks === "function"
						? player.getAudioTracks()
						: [];
				const audioTrack = audioTracks.find((track) => track.active);
				const audioLabel = normalizeMetricLabel(audioTrack?.label);
				if (audioLabel) return audioLabel;

				const variantTracks =
					typeof player.getVariantTracks === "function"
						? player.getVariantTracks()
						: [];
				const variantTrack = variantTracks.find(
					(track) => track.active,
				);
				return normalizeMetricLabel(variantTrack?.label);
			}
			function updateSelectedVoice(player) {
				const voice = getSelectedVoice(player);
				if (voice) {
					metricDatas.voice = voice;
					sendViewLabelsMetric();
				}
			}
			function initAudioMetricTracking(player) {
				const update = () => updateSelectedVoice(player);
				["trackschanged", "variantchanged", "audiotrackchanged"].forEach(
					(eventName) => {
						player.addEventListener(eventName, update);
					},
				);
				update();
			}
			function sendViewLabelsMetric() {
				const key = JSON.stringify(metricDatas);
				if (viewLabelsMetric.sentKey === key) return;

				viewLabelsMetric.sentKey = key;
				const url = backendUrl + "/metrics/view-labels";
				const data = JSON.stringify(metricDatas);
				const blob = new Blob([data], { type: "application/json" });
				navigator.sendBeacon(url, blob);
			}
			function clearViewStartedMetricTimer() {
				if (viewStartedMetric.timerId) {
					clearTimeout(viewStartedMetric.timerId);
					viewStartedMetric.timerId = null;
				}
			}
			function sendViewStartedMetric() {
				if (viewStartedMetric.sent) return;

				const seconds = getViewingTimeSeconds();
				if (seconds < viewStartedMetric.thresholdSeconds) return;

				viewStartedMetric.sent = true;
				clearViewStartedMetricTimer();
				updateSelectedVoice(metricPlayer);

				const url = backendUrl + "/metrics/view-started";
				const data = JSON.stringify({
					seconds,
					...metricDatas,
				});
				const blob = new Blob([data], { type: "application/json" });
				navigator.sendBeacon(url, blob);
			}
			function scheduleViewStartedMetricCheck() {
				clearViewStartedMetricTimer();
				if (viewStartedMetric.sent || !viewingTime.startTime) return;

				const remainingMs = Math.max(
					0,
					(viewStartedMetric.thresholdSeconds -
						getViewingTimeSeconds()) *
						1000,
				);
				viewStartedMetric.timerId = setTimeout(() => {
					updateViewStartedMetricState();
				}, remainingMs + 100);
			}
			function updateViewStartedMetricState() {
				if (viewStartedMetric.sent) return;
				if (getViewingTimeSeconds() >= viewStartedMetric.thresholdSeconds) {
					sendViewStartedMetric();
					return;
				}
				scheduleViewStartedMetricCheck();
			}
			function areSubtitlesVisible(player, video) {
				if (
					player &&
					typeof player.isTextTrackVisible === "function" &&
					player.isTextTrackVisible()
				) {
					return true;
				}

				const textTracks = video?.textTracks
					? Array.from(video.textTracks)
					: [];
				return textTracks.some((track) => track.mode === "showing");
			}
			function getSubtitleMetricSeconds() {
				const activeSeconds = subtitleMetric.activeStartedAt
					? (Date.now() - subtitleMetric.activeStartedAt) / 1000
					: 0;
				return subtitleMetric.activeSeconds + activeSeconds;
			}
			function clearSubtitleMetricTimer() {
				if (subtitleMetric.timerId) {
					clearTimeout(subtitleMetric.timerId);
					subtitleMetric.timerId = null;
				}
			}
			function sendSubtitleMetric() {
				if (subtitleMetric.sent) return;
				subtitleMetric.sent = true;
				clearSubtitleMetricTimer();

				const url = backendUrl + "/metrics/subtitles";
				const data = JSON.stringify({
					seconds: Math.floor(getSubtitleMetricSeconds()),
					season: metricDatas.season,
					episode: metricDatas.episode,
				});
				const blob = new Blob([data], { type: "application/json" });
				navigator.sendBeacon(url, blob);
			}
			function scheduleSubtitleMetricCheck() {
				clearSubtitleMetricTimer();
				if (subtitleMetric.sent || !subtitleMetric.activeStartedAt) {
					return;
				}

				const remainingMs = Math.max(
					0,
					(subtitleMetric.thresholdSeconds -
						getSubtitleMetricSeconds()) *
						1000,
				);
				subtitleMetric.timerId = setTimeout(() => {
					updateSubtitleMetricState();
				}, remainingMs + 100);
			}
			function updateSubtitleMetricState() {
				if (subtitleMetric.sent) return;

				const shouldTrack =
					metricVideo &&
					!metricVideo.paused &&
					!metricVideo.ended &&
					document.visibilityState === "visible" &&
					areSubtitlesVisible(metricPlayer, metricVideo);

				if (shouldTrack && !subtitleMetric.activeStartedAt) {
					subtitleMetric.activeStartedAt = Date.now();
				}

				if (!shouldTrack && subtitleMetric.activeStartedAt) {
					subtitleMetric.activeSeconds = getSubtitleMetricSeconds();
					subtitleMetric.activeStartedAt = null;
				}

				if (
					getSubtitleMetricSeconds() >=
					subtitleMetric.thresholdSeconds
				) {
					sendSubtitleMetric();
					return;
				}

				scheduleSubtitleMetricCheck();
			}
			function initSubtitleMetricTracking(player, video) {
				const update = () => updateSubtitleMetricState();
				["texttrackvisibility", "trackschanged"].forEach((eventName) => {
					player.addEventListener(eventName, update);
				});
				["play", "playing", "pause", "ended"].forEach((eventName) => {
					video.addEventListener(eventName, update);
				});
				if (video.textTracks?.addEventListener) {
					video.textTracks.addEventListener("change", update);
				}
				document.addEventListener("visibilitychange", update);
				update();
			}
			function initMetricDatas(src) {
				//src =
				//	"https://video.dcote.net/season-04/episode-01/master.m3u8";
				const match = src.match(
					/(?:^|\/)season-(\d+)\/episode-(\d+)(?:\/|$)/,
				);
				if (!match) return;
				const season = match[1];
				const episode = match[2];
				metricDatas.season = season;
				metricDatas.episode = episode;
				metricDatas.voice = null;
				viewStartedMetric.sent = false;
				clearViewStartedMetricTimer();
				viewLabelsMetric.sentKey = null;
				viewingTime.watchedSeconds = 0;
				viewingTime.startTime = null;
				sendViewLabelsMetric();
			}
			function flushViewingTimeMetric() {
				saveViewingTime();
				updateSubtitleMetricState();
				updateSelectedVoice(metricPlayer);
				sendViewStartedMetric();

				if (viewingTime.watchedSeconds < 30) return;

				const url = backendUrl + "/metrics/viewing-time";
				const data = JSON.stringify({
					seconds: viewingTime.watchedSeconds,
					...metricDatas,
				});
				const blob = new Blob([data], { type: "application/json" });
				navigator.sendBeacon(url, blob);
				viewingTime.watchedSeconds = 0;
			}
			document.addEventListener("visibilitychange", function () {
				if (document.visibilityState === "hidden") {
					flushViewingTimeMetric();
					return;
				}

				if (
					metricVideo &&
					!metricVideo.paused &&
					!metricVideo.ended
				) {
					initViewingTime();
				}
				updateSubtitleMetricState();
			});
			window.addEventListener("pagehide", flushViewingTimeMetric);
			//TODO: разделить
			const ws = new WebSocket(websocketUrl);
			function initWebSocket(ws) {
				ws.onopen = () => {
					console.log("WS подключён");
				};

				ws.onmessage = (msg) => {
					//const data = JSON.parse(msg.data);
					//console.log("Сервер ответил:", data);
				};

				ws.onclose = () => {
					console.log("WS отключён");
				};
			}
			initWebSocket(ws);
			//
			function onError(error) {
				console.error(
					"Shaka Error:",
					error.code,
					error.message || error,
				);
			}
			async function init() {
				shaka.polyfill.installAll();
				if (!shaka.Player.isBrowserSupported()) {
					alert("Браузер не поддерживается");
					return;
				}

				const video = document.getElementById("video");
				const container = document.getElementById("player-container");
				const posterCover = document.getElementById("poster-cover");
				const skipBtn = document.getElementById("skip-btn");
				const player = new shaka.Player(null, container);
				metricPlayer = player;
				metricVideo = video;
				if (typeof player.setVideoContainer === "function") {
					player.setVideoContainer(container);
				}
				await player.attach(video);

				video.addEventListener("play", () => {
					initViewingTime();
				});

				video.addEventListener("pause", () => {
					saveViewingTime();
				});
				player.addEventListener("error", (e) => onError(e.detail));

				const ui = new shaka.ui.Overlay(player, container, video);
				const controls = ui.getControls();

				const params = playerParams;
				const src = params.get("src");

				const poster = params.get("poster");
				const skipStart = parseFloat(params.get("skip_start") || "-1");
				const skipEnd = parseFloat(params.get("skip_end") || "-1");

				const showPoster = () => {
					if (!poster) return;
					video.poster = poster;
					posterCover.style.backgroundImage = `url(${JSON.stringify(
						poster,
					)})`;
					posterCover.classList.add("visible");
				};
				const hidePoster = () => {
					posterCover.classList.remove("visible");
				};

				showPoster();
				video.addEventListener("play", hidePoster);
				video.addEventListener("playing", hidePoster);

				const trackLabelFormat =
					shaka.ui.Overlay.TrackLabelFormat.LABEL;

				ui.configure({
					enableKeyboardPlaybackControls: false,
					addSeekBar: true,
					controlPanelElements: [
						"play_pause",
						"mute",
						"volume",
						"time_and_duration",
						"spacer",
						"overflow_menu",
						"picture_in_picture",
						"fullscreen",
					],
					overflowMenuButtons: [
						"quality",
						"language",
						"playback_rate",
						"captions",
						"loop",
					],
					// LABEL maps to HLS #EXT-X-MEDIA NAME and keeps
					// same-language audio tracks split in the menu.
					trackLabelFormat,
					seekBarColors: { played: "rgb(224, 11, 82)" },
				});

				const localization = controls.getLocalization();
				const RU = "ru";
				localization.insert(
					RU,
					new Map([
						["PLAY", "Воспроизвести"],
						["PAUSE", "Пауза"],
						["REPLAY", "Повторить"],
						["MUTE", "Выключить звук"],
						["UNMUTE", "Включить звук"],
						["FULL_SCREEN", "Полный экран"],
						["EXIT_FULL_SCREEN", "Выйти"],
						["ENTER_PICTURE_IN_PICTURE", "Картинка в картинке"],
						["MORE_SETTINGS", "Настройки"],
						["CAPTIONS", "Субтитры"],
						["LOOP", "Повтор"],
						["PLAYBACK_RATE", "Скорость"],
						["QUALITY", "Качество"],
						["AUTO_QUALITY", "Авто"],
						["RESOLUTION", "Разрешение"],
						["OFF", "Выкл"],
						["LANGUAGE", "Озвучка"],
					]),
				);
				localization.changeLocale([RU]);

				window.addEventListener("keydown", (e) => {
					if (
						["INPUT", "SELECT", "TEXTAREA"].includes(
							document.activeElement.tagName,
						)
					)
						return;
					switch (e.code) {
						case "Space":
						case "KeyK":
							e.preventDefault();
							video.paused ? video.play() : video.pause();
							break;
						case "ArrowRight":
							video.currentTime += 5;
							break;
						case "ArrowLeft":
							video.currentTime -= 5;
							break;
						case "ArrowUp":
							e.preventDefault();
							video.volume = Math.min(1, video.volume + 0.1);
							break;
						case "ArrowDown":
							e.preventDefault();
							video.volume = Math.max(0, video.volume - 0.1);
							break;
						case "KeyM":
							video.muted = !video.muted;
							break;
						case "KeyF":
							controls.toggleFullScreen();
							break;
					}
				});

				const shakaButtons = container.querySelectorAll(
					"button, .shaka-range-element",
				);
				shakaButtons.forEach((btn) => {
					btn.addEventListener("click", () => {
						btn.blur();
					});
				});

				const skipAction = document.getElementById("skip-btn-action");
				const skipDismiss = document.getElementById("skip-btn-dismiss");
				const skipTarget =
					skipEnd > skipStart && skipEnd >= 0
						? skipEnd
						: skipStart + 85;

				let skipDismissed = false;

				video.addEventListener("timeupdate", () => {
					const isInsideRange =
						video.currentTime > skipStart &&
						video.currentTime < skipTarget &&
						skipStart >= 0;
					const overflowMenu = document.querySelector(
						".shaka-overflow-menu",
					);
					const isMenuOpen =
						overflowMenu &&
						!overflowMenu.classList.contains("shaka-hidden");
					if (isInsideRange && !skipDismissed && !isMenuOpen) {
						skipBtn.classList.add("visible");
					} else {
						skipBtn.classList.remove("visible");
					}
				});

				const silenceShaka = (e) => {
					e.stopPropagation();
					e.stopImmediatePropagation();
					if (
						controls &&
						typeof controls.setEnabledShakaControls === "function"
					) {
						controls.setEnabledShakaControls(false);
						setTimeout(
							() => controls.setEnabledShakaControls(true),
							400,
						);
					}
				};

				["pointerdown", "touchstart", "mousedown"].forEach((type) => {
					skipBtn.addEventListener(type, silenceShaka, true);
				});

				skipAction.addEventListener(
					"click",
					(e) => {
						e.stopPropagation();
						e.stopImmediatePropagation();
						video.currentTime = skipTarget;
						skipBtn.classList.remove("visible");
						if (controls && typeof controls.hideUI === "function") {
							controls.hideUI();
						}
					},
					true,
				);

				skipDismiss.addEventListener(
					"click",
					(e) => {
						e.stopPropagation();
						e.stopImmediatePropagation();
						skipDismissed = true;
						skipBtn.classList.remove("visible");
						if (controls && typeof controls.hideUI === "function") {
							controls.hideUI();
						}
					},
					true,
				);

				const overflowBtn = document.querySelector(
					".shaka-overflow-menu-button",
				);
				if (overflowBtn) {
					overflowBtn.addEventListener("click", () => {
						skipBtn.classList.remove("visible");
					});
				}

				if (src) {
					try {
						await player.load(src);
						showPoster();
						initMetricDatas(src);
						initAudioMetricTracking(player);
						initSubtitleMetricTracking(player, video);
					} catch (e) {
						onError(e);
					}
				}
			}
			document.addEventListener("DOMContentLoaded", init);
		</script>
	</body>
</html>
