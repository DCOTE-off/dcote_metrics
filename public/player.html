<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>Player</title>
		<script defer src="vendor/shaka/shaka-player.ui.js"></script>
		<link
			rel="stylesheet"
			href="vendor/shaka/controls.css"
		/>
		<link rel="stylesheet" href="player.css" />
	</head>

	<body>
		<div id="player-container">
			<video id="video" playsinline></video>
			<div id="poster-cover" aria-hidden="true"></div>
			<div id="video-zoom-feedback" aria-live="polite"></div>
			<div id="mobile-context-menu" role="menu">
				<button id="mobile-context-loop" type="button" role="menuitem">
					Повтор
				</button>
				<button id="mobile-context-pip" type="button" role="menuitem">
					Картинка в картинке
				</button>
				<button id="mobile-context-save-frame" type="button" role="menuitem">
					Сохранить кадр видео
				</button>
			</div>
			<div id="skip-btn" class="shaka-no-propagation">
				<button
					id="skip-btn-dismiss"
					type="button"
					aria-label="Закрыть предложение пропустить опенинг"
				>
					<div id="skip-btn-dismiss-inner">
						<img
							style="display: block; font-size: 16px"
							class="shaka-ui-icon"
							src="icons/file-x.svg"
							alt=""
						/>
					</div>
				</button>
				<button id="skip-btn-action" type="button">
					<div id="skip-btn-action-inner">Пропустить опенинг</div>
				</button>
			</div>
		</div>
		<script defer src="player.js"></script>
		<script defer src="player-subtitles.js"></script>
	</body>
</html>
