<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>Player</title>
		<script src="vendor/shaka/shaka-player.ui.js"></script>
		<link
			rel="stylesheet"
			href="vendor/shaka/controls.css"
		/>
		<style>
			@font-face {
				font-family: "VAG Rounded Next";
				src: url("/fonts/vag-rounded-next-bold.woff2") format("woff2");
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			* {
				-webkit-tap-highlight-color: transparent;
			}

			html,
			body {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				min-width: 100%;
				min-height: 100%;
				background: #000 !important;
				overflow: hidden;
			}

			#player-container {
				position: relative;
				width: 100%;
				height: 100%;
				background: #000;
				overflow: hidden;
				--video-zoom: 1;
				--video-pan-x: 0px;
				--video-pan-y: 0px;
			}

			#player-container:fullscreen,
			#player-container:-webkit-full-screen {
				position: fixed;
				inset: -1px;
				width: auto;
				height: auto;
				background: #000 !important;
				box-shadow: 0 0 0 2px #000;
			}

			#video {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: contain;
			}

			#video,
			#poster-cover {
				transform-origin: center;
				transition: transform 0.18s ease-out;
			}

			#player-container.video-zoom-active #video,
			#player-container.video-zoom-active #poster-cover,
			#player-container.video-zoom-active .JASSUB {
				transform: translate3d(
						var(--video-pan-x),
						var(--video-pan-y),
						0
					)
					scale(var(--video-zoom));
			}

			#player-container.video-zoom-gesturing #video,
			#player-container.video-zoom-gesturing #poster-cover,
			#player-container.video-zoom-gesturing .JASSUB {
				transition: none;
			}

			#player-container.video-zoom-touch-active {
				touch-action: none;
			}

			#player-container .shaka-controls-container {
				transition: opacity 0.2s ease !important;
			}

			#player-container.touch-controls-hidden .shaka-controls-container {
				opacity: 0 !important;
				pointer-events: none !important;
			}

			#poster-cover {
				position: absolute;
				inset: 0;
				background: #000 center / contain no-repeat;
				opacity: 0;
				pointer-events: none;
				transition:
					opacity 0.2s ease,
					transform 0.18s ease-out;
			}

			#poster-cover.visible {
				opacity: 1;
			}

			.shaka-spinner-container .shaka-spinner svg g circle {
				stroke: rgba(255, 255, 255, 0.2) !important;
				stroke-opacity: 1 !important;
			}

			.shaka-spinner-container .shaka-spinner svg g path {
				stroke: rgba(224, 11, 82, 0.8) !important;
				/* Сделал чуть ярче для контраста */
				stroke-linecap: round !important;
			}

			.shaka-range-element {
				background: transparent !important;
			}

			.shaka-seek-bar-container
				.shaka-range-element::-webkit-slider-thumb {
				background: rgb(224, 11, 82) !important;
				transform: translateX(-1px);
			}

			.shaka-seek-bar-container .shaka-range-element::-moz-range-thumb {
				background: rgb(224, 11, 82) !important;
				transform: translateX(-1px);
			}

			.shaka-text-container {
				inset: 0 !important;
				width: 100% !important;
				height: 100% !important;
				pointer-events: none;
			}

			.shaka-text-container [translate="no"],
			.shaka-text-container .shaka-text-wrapper {
				background: transparent !important;
				background-color: transparent !important;
				border-radius: 0 !important;
				box-shadow: none !important;
				font-family: "VAG Rounded Next", Arial, sans-serif !important;
				font-weight: 700 !important;
				color: #fff !important;
				font-size: clamp(14px, 3.2vw, 40px) !important;
				font-size: clamp(14px, min(3.2vw, 5.8vh), 40px) !important;
				line-height: 1.05 !important;
				letter-spacing: 0 !important;
				white-space: pre-wrap !important;
				text-shadow:
					0 0.075em 0 #000,
					0 -0.075em 0 #000,
					0.075em 0 0 #000,
					-0.075em 0 0 #000,
					0.055em 0.055em 0 #000,
					-0.055em 0.055em 0 #000,
					0.055em -0.055em 0 #000,
					-0.055em -0.055em 0 #000,
					0 0.055em 0 #000,
					0 -0.055em 0 #000,
					0.055em 0 0 #000,
					-0.055em 0 0 #000,
					0.04em 0.04em 0 #000,
					-0.04em 0.04em 0 #000,
					0.04em -0.04em 0 #000,
					-0.04em -0.04em 0 #000,
					0 0.11em 0.22em rgba(0, 0, 0, 0.85) !important;
			}

			.shaka-text-container [translate="no"] {
				box-decoration-break: clone;
				-webkit-box-decoration-break: clone;
				border-radius: 0 !important;
				padding: 0 !important;
			}

			#player-container:fullscreen
				.shaka-text-container
				[translate="no"],
			#player-container:fullscreen
				.shaka-text-container
				.shaka-text-wrapper,
			#player-container:-webkit-full-screen
				.shaka-text-container
				[translate="no"],
			#player-container:-webkit-full-screen
				.shaka-text-container
				.shaka-text-wrapper {
				font-size: clamp(14px, 3.2vw, 48px) !important;
				font-size: clamp(14px, min(3.2vw, 5.8vh), 48px) !important;
			}

			#player-container.ass-subtitles-active .shaka-text-container {
				visibility: hidden !important;
			}

			#player-container .JASSUB {
				background: transparent !important;
				pointer-events: none;
				transform-origin: center;
				visibility: hidden;
			}

			#video-zoom-feedback {
				background: rgba(28, 28, 28, 0.88);
				border-radius: 12px;
				color: #fff;
				font: 700 15px/1.2 "VAG Rounded Next", Arial, sans-serif;
				left: 50%;
				opacity: 0;
				padding: 10px 14px;
				pointer-events: none;
				position: absolute;
				top: 28px;
				transform: translateX(-50%);
				transition: opacity 0.18s ease;
				z-index: 101;
			}

			#video-zoom-feedback.visible {
				opacity: 1;
			}

			#mobile-context-menu {
				background: rgba(28, 28, 28, 0.96);
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 14px;
				box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
				display: none;
				min-width: 220px;
				overflow: hidden;
				position: absolute;
				z-index: 200;
			}

			#mobile-context-menu.visible {
				display: block;
			}

			#mobile-context-menu button {
				background: transparent;
				border: 0;
				color: #fff;
				display: block;
				font: 700 15px/1.2 "VAG Rounded Next", Arial, sans-serif;
				padding: 14px 16px;
				text-align: left;
				touch-action: manipulation;
				width: 100%;
			}

			#mobile-context-menu button + button {
				border-top: 1px solid rgba(255, 255, 255, 0.1);
			}

			#mobile-context-menu button:active,
			#mobile-context-menu button.active {
				background: rgba(255, 255, 255, 0.12);
			}

			#mobile-context-menu button:disabled {
				color: rgba(255, 255, 255, 0.38);
			}

			video::cue {
				background: transparent;
				background-color: transparent;
				font-family: "VAG Rounded Next", Arial, sans-serif;
				font-weight: 700;
				color: #fff;
				-webkit-text-fill-color: #fff;
				font-size: clamp(14px, 3.2vw, 40px);
				font-size: clamp(14px, min(3.2vw, 5.8vh), 40px);
				line-height: 1.05;
				text-shadow:
					0 0.075em 0 #000,
					0 -0.075em 0 #000,
					0.075em 0 0 #000,
					-0.075em 0 0 #000,
					0.055em 0.055em 0 #000,
					-0.055em 0.055em 0 #000,
					0.055em -0.055em 0 #000,
					-0.055em -0.055em 0 #000,
					0 0.055em 0 #000,
					0 -0.055em 0 #000,
					0.055em 0 0 #000,
					-0.055em 0 0 #000,
					0.04em 0.04em 0 #000,
					-0.04em 0.04em 0 #000,
					0.04em -0.04em 0 #000,
					-0.04em -0.04em 0 #000,
					0 0.11em 0.22em rgba(0, 0, 0, 0.85);
			}

			video::cue(*) {
				background: transparent;
				background-color: transparent;
				color: #fff;
				-webkit-text-fill-color: #fff;
			}

			#player-container:fullscreen video::cue,
			#player-container:-webkit-full-screen video::cue {
				font-size: clamp(14px, 3.2vw, 48px);
				font-size: clamp(14px, min(3.2vw, 5.8vh), 48px);
			}

			video::-webkit-media-text-track-container {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-display {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-region {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-region-container {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			video::-webkit-media-text-track-background {
				background: transparent !important;
				background-color: transparent !important;
				box-shadow: none !important;
			}

			@media (max-width: 1100px), (max-height: 720px) {
				.shaka-text-container [translate="no"],
				.shaka-text-container .shaka-text-wrapper {
					font-size: clamp(14px, 3.2vw, 28px) !important;
					font-size: clamp(14px, min(3.2vw, 5vh), 28px) !important;
				}

				video::cue {
					background: transparent;
					background-color: transparent;
					font-size: clamp(14px, 3.2vw, 28px);
					font-size: clamp(14px, min(3.2vw, 5vh), 28px);
				}
			}

			#skip-btn {
				display: none;
				position: fixed;
				bottom: 90px;
				right: 16px;
				z-index: 100;
				gap: 10px;
			}

			#skip-btn-dismiss,
			#skip-btn-action {
				background: rgba(28, 28, 28, 0.9);
				color: #fff;
				border: none;
				border-radius: 12px;
				transition: opacity cubic-bezier(0.4, 0, 0.6, 1) 0.6s;
				padding: 5px;
				cursor: pointer;
			}

			#skip-btn-dismiss-inner,
			#skip-btn-action-inner {
				padding: 10px;
				border-radius: 12px;
				font-size: 14px;
			}

			#skip-btn.visible {
				display: flex;
			}

			#skip-btn-dismiss:hover #skip-btn-dismiss-inner,
			#skip-btn-action:hover #skip-btn-action-inner {
				background: rgba(255, 255, 255, 0.1);
			}
		</style>
	</head>

	<body>
		<div id="player-container">
			<video id="video" playsinline></video>
			<div id="poster-cover" aria-hidden="true"></div>
			<div id="video-zoom-feedback" aria-live="polite"></div>
			<div id="mobile-context-menu" role="menu">
				<button id="mobile-context-loop" type="button" role="menuitem">
					Повтор
				</button>
				<button id="mobile-context-pip" type="button" role="menuitem">
					Картинка в картинке
				</button>
				<button id="mobile-context-save-frame" type="button" role="menuitem">
					Сохранить кадр видео
				</button>
			</div>
			<div id="skip-btn">
				<button id="skip-btn-dismiss">
					<div id="skip-btn-dismiss-inner">
						<img
							style="display: block; font-size: 16px"
							class="shaka-ui-icon"
							src="icons/file-x.svg"
						/>
					</div>
				</button>
				<button id="skip-btn-action">
					<div id="skip-btn-action-inner">Пропустить опенинг</div>
				</button>
			</div>
		</div>
		<script>
			const playerParams = new URLSearchParams(location.search);
			const requestedVttBottomLine = Number(
				playerParams.get("vtt_bottom_line") || "88",
			);
			const defaultVttBottomLine = Number.isFinite(requestedVttBottomLine)
				? Math.min(100, Math.max(0, requestedVttBottomLine))
				: 88;
			const localHostnamePattern =
				/^(localhost|127\.0\.0\.1|::1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/;
			const stage =
				playerParams.get("stage") ||
				(localHostnamePattern.test(location.hostname) ? "dev" : "prod");
			const backendUrl =
				stage == "dev"
					? location.origin
					: "https://video.dcote.net/metrics-api";
			const playerAssetBase = backendUrl;
			const jassubAssetVersion = "canvas2d-1";
			const websocketUrl =
				stage == "dev"
					? `${location.protocol === "https:" ? "wss" : "ws"}://${
							location.host
						}/metrics/ws`
					: "wss://video.dcote.net/metrics-api/metrics/ws";

			function sendJsonMetric(path, payload) {
				try {
					const data = JSON.stringify(payload);
					const url = `${backendUrl}/metrics/${path}`;
					if (typeof navigator.sendBeacon === "function") {
						const blob = new Blob([data], { type: "application/json" });
						return navigator.sendBeacon(url, blob);
					}

					fetch(url, {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: data,
						keepalive: true,
					}).catch(() => {});
					return true;
				} catch {
					return false;
				}
			}

			const viewingTime = { watchedSeconds: 0, startTime: null };
			const viewStartedMetric = {
				sent: false,
				thresholdSeconds: 30,
				timerId: null,
			};
			const viewLabelsMetric = {
				sentKey: null,
			};
			function initViewingTime() {
				if (!viewingTime.startTime) {
					viewingTime.startTime = Date.now();
				}
				scheduleViewStartedMetricCheck();
			}
			function saveViewingTime() {
				if (viewingTime.startTime) {
					let dif = Math.floor(
						(Date.now() - viewingTime.startTime) / 1000,
					);
					viewingTime.watchedSeconds += dif;
					viewingTime.startTime = null;
				}
				updateViewStartedMetricState();
			}
			function getViewingTimeSeconds() {
				const activeSeconds = viewingTime.startTime
					? Math.floor((Date.now() - viewingTime.startTime) / 1000)
					: 0;
				return viewingTime.watchedSeconds + activeSeconds;
			}
			const metricDatas = {
				season: null,
				episode: null,
				voice: null,
			};
			let metricPlayer = null;
			let metricVideo = null;
			const assSubtitles = {
				renderer: null,
				language: "ru",
				ready: false,
				status: "idle",
				error: null,
				bottomMargin: null,
				baseStyles: null,
				resizeObserver: null,
				resizeTimerId: null,
				renderedFontLimit: null,
			};
			const subtitleMetric = {
				activeSeconds: 0,
				activeStartedAt: null,
				sent: false,
				thresholdSeconds: 30,
				timerId: null,
			};
			function positionUnpositionedVttCues(cues) {
				for (const cue of cues) {
					const hasRegion = Boolean(cue.region?.id);
					if (cue.line != null || hasRegion) continue;

					cue.line = defaultVttBottomLine;
					cue.lineInterpretation =
						shaka.text.Cue.lineInterpretation.PERCENTAGE;
					cue.lineAlign = shaka.text.Cue.lineAlign.END;
				}
				return cues;
			}
			function createPositionedTextDisplayer(player) {
				const video = player.getMediaElement();
				const prefersUiTextDisplayer =
					video &&
					!video?.webkitDisplayingFullscreen &&
					(!video?.webkitPresentationMode ||
						video.webkitPresentationMode === "inline");
				let displayer;
				if (prefersUiTextDisplayer) {
					displayer = new shaka.text.UITextDisplayer(player);
				} else if ("track" in document.createElement("track")) {
					displayer = new shaka.text.NativeTextDisplayer(player);
				} else {
					displayer = new shaka.text.StubTextDisplayer();
				}
				const append = displayer.append.bind(displayer);
				displayer.append = (cues) => {
					append(positionUnpositionedVttCues(cues));
				};
				return displayer;
			}
			function getActiveTextTrack(player) {
				if (!player || typeof player.getTextTracks !== "function") {
					return null;
				}
				return player.getTextTracks().find((track) => track.active) || null;
			}
			function isAssTextTrackSelected(player) {
				const activeTrack = getActiveTextTrack(player);
				if (!activeTrack) return false;

				const activeLanguage = (activeTrack.language || "")
					.split("-")[0]
					.toLowerCase();
				return (
					!assSubtitles.language ||
					!activeLanguage ||
					activeLanguage === "und" ||
					activeLanguage === assSubtitles.language
				);
			}
			function syncAssSubtitleVisibility(player) {
				const container = document.getElementById("player-container");
				const canvas = assSubtitles.renderer?._canvas;
				const shouldShow =
					assSubtitles.ready &&
					canvas &&
					isAssTextTrackSelected(player);

				if (canvas) {
					canvas.style.visibility = shouldShow ? "visible" : "hidden";
				}
				container.classList.toggle("ass-subtitles-active", Boolean(shouldShow));
				container.dataset.subtitleRenderer = shouldShow ? "ass" : "vtt";
				updateSubtitleDebugLabel(player);
			}
			function updateSubtitleDebugLabel(player) {
				if (playerParams.get("subtitle_debug") !== "1") return;

				let label = document.getElementById("subtitle-debug-label");
				if (!label) {
					label = document.createElement("div");
					label.id = "subtitle-debug-label";
					Object.assign(label.style, {
						position: "fixed",
						top: "8px",
						left: "8px",
						zIndex: "1000",
						padding: "6px 8px",
						background: "rgba(0, 0, 0, 0.8)",
						color: "#fff",
						font: "12px monospace",
						pointerEvents: "none",
					});
					document.body.appendChild(label);
				}

				label.textContent = [
					`renderer=${document.getElementById("player-container").dataset.subtitleRenderer || "vtt"}`,
					`ass=${assSubtitles.status}`,
					`captions=${getActiveTextTrack(player) ? "on" : "off"}`,
					`margin=${assSubtitles.bottomMargin ?? "-"}`,
					`fontLimit=${assSubtitles.renderedFontLimit ?? "-"}`,
					assSubtitles.error ? `error=${assSubtitles.error}` : "",
				]
					.filter(Boolean)
					.join(" | ");
			}
			function raiseBottomAssStyles(subContent, bottomMarginPercent) {
				const percent = Math.min(
					40,
					Math.max(0, Number(bottomMarginPercent) || 0),
				);
				if (!percent) return subContent;

				const lines = subContent.split(/\r?\n/);
				const playResYLine = lines.find((line) =>
					/^PlayResY\s*:/i.test(line),
				);
				const playResY = Number(playResYLine?.split(":")[1]) || 360;
				const minimumMargin = Math.round((playResY * percent) / 100);
				let section = "";
				let styleFormat = [];

				return lines
					.map((line) => {
						const sectionMatch = line.match(/^\s*\[([^\]]+)\]\s*$/);
						if (sectionMatch) {
							section = sectionMatch[1].toLowerCase();
							return line;
						}
						if (section !== "v4+ styles") return line;

						const formatMatch = line.match(/^\s*Format\s*:\s*(.+)$/i);
						if (formatMatch) {
							styleFormat = formatMatch[1]
								.split(",")
								.map((field) => field.trim().toLowerCase());
							return line;
						}

						const styleMatch = line.match(/^(\s*Style\s*:\s*)(.+)$/i);
						if (!styleMatch || !styleFormat.length) return line;

						const fields = styleMatch[2].split(",");
						const alignmentIndex = styleFormat.indexOf("alignment");
						const marginVIndex = styleFormat.indexOf("marginv");
						const alignment = Number(fields[alignmentIndex]);
						if (
							!Number.isInteger(alignment) ||
							alignment < 1 ||
							alignment > 3 ||
							marginVIndex < 0
						) {
							return line;
						}

						const currentMargin = Number(fields[marginVIndex]) || 0;
						fields[marginVIndex] = String(
							Math.max(currentMargin, minimumMargin),
						);
						return styleMatch[1] + fields.join(",");
					})
					.join("\n");
			}
			function scaleInlineAssFontSizes(subContent, scale) {
				return subContent.replace(
					/\\fs(\d+(?:\.\d+)?)/gi,
					(match, fontSize) =>
						`\\fs${(Number(fontSize) * scale).toFixed(2)}`,
				);
			}
			async function applyBottomAssStyleMargin(
				renderer,
				subContent,
				bottomMarginPercent,
			) {
				const playResYLine = subContent
					.split(/\r?\n/)
					.find((line) => /^PlayResY\s*:/i.test(line));
				const playResY = Number(playResYLine?.split(":")[1]) || 360;
				const minimumMargin = Math.round(
					(playResY * bottomMarginPercent) / 100,
				);
				const styles = await renderer.renderer.getStyles();

				for (let index = 0; index < styles.length; index += 1) {
					const style = styles[index];
					if (style.Alignment < 1 || style.Alignment > 3) continue;
					if (style.MarginV >= minimumMargin) continue;
					await renderer.renderer.setStyle(
						{ ...style, MarginV: minimumMargin },
						index,
					);
				}

				assSubtitles.bottomMargin = minimumMargin;
			}
			async function applyResponsiveAssStyles(renderer, subContent, video) {
				const playResYLine = subContent
					.split(/\r?\n/)
					.find((line) => /^PlayResY\s*:/i.test(line));
				const playResY = Number(playResYLine?.split(":")[1]) || 360;
				const displayHeight =
					renderer._canvas?.getBoundingClientRect().height ||
					video.getBoundingClientRect().height;
				if (!displayHeight) return;
				const fullscreenElement =
					document.fullscreenElement ||
					document.webkitFullscreenElement ||
					null;
				const fullscreenScale =
					fullscreenElement &&
					(fullscreenElement === video ||
						fullscreenElement.contains(video)) &&
					window.innerWidth > 1100 &&
					window.innerHeight > 720
						? 1.2
						: 1;

				if (!assSubtitles.baseStyles) {
					assSubtitles.baseStyles = (await renderer.renderer.getStyles()).map(
						(style) => ({ ...style }),
					);
				}

				const renderedFontLimit =
					Math.min(40, Math.max(18, displayHeight * 0.055)) *
					fullscreenScale;
				const renderScale = displayHeight / playResY;

				for (
					let index = 0;
					index < assSubtitles.baseStyles.length;
					index += 1
				) {
					const style = assSubtitles.baseStyles[index];
					const renderedFontSize = style.FontSize * renderScale;
					const scale = Math.min(
						0.88 * fullscreenScale,
						renderedFontSize > 0
							? renderedFontLimit / renderedFontSize
							: 0.88 * fullscreenScale,
					);
					await renderer.renderer.setStyle(
						{
							...style,
							FontSize: style.FontSize * scale,
							Outline: style.Outline * scale,
							Shadow: style.Shadow * scale,
						},
						index,
					);
				}

				assSubtitles.renderedFontLimit = Math.round(renderedFontLimit);
				await renderer.resize(true);
			}
			function scheduleResponsiveAssStyles(renderer, subContent, video) {
				clearTimeout(assSubtitles.resizeTimerId);
				assSubtitles.resizeTimerId = setTimeout(() => {
					applyResponsiveAssStyles(renderer, subContent, video)
						.then(() => updateSubtitleDebugLabel(metricPlayer))
						.catch((error) => {
							console.warn("Unable to resize ASS subtitles.", error);
						});
				}, 120);
			}
			async function raiseBottomAssEventMargins(
				renderer,
				subContent,
				bottomMarginPercent,
			) {
				const lines = subContent.split(/\r?\n/);
				const playResYLine = lines.find((line) =>
					/^PlayResY\s*:/i.test(line),
				);
				const playResY = Number(playResYLine?.split(":")[1]) || 360;
				const minimumMargin = Math.round(
					(playResY * bottomMarginPercent) / 100,
				);
				const styles = await renderer.renderer.getStyles();
				const events = await renderer.renderer.getEvents();

				for (let index = 0; index < events.length; index += 1) {
					const event = events[index];
					const style = styles[event.Style];
					if (!style || /\\(?:pos|move)\s*\(/i.test(event.Text)) {
						continue;
					}

					const inlineAlignment = event.Text.match(/\\an([1-9])/i);
					const alignment = Number(inlineAlignment?.[1]) || style.Alignment;
					if (alignment < 1 || alignment > 3) continue;

					if (event.MarginV >= minimumMargin) continue;
					await renderer.renderer.setEvent(
						{ ...event, MarginV: minimumMargin },
						index,
					);
				}
			}
			async function initAssSubtitles(

				video,
				assUrl,
				bottomMarginPercent,
			) {
				try {
					assSubtitles.status = "loading";

					const subtitleResponse = await fetch(assUrl);
					if (!subtitleResponse.ok) {
						throw new Error(
							`ASS request failed with status ${subtitleResponse.status}`,
						);
					}
					const subContent = scaleInlineAssFontSizes(
						raiseBottomAssStyles(
							await subtitleResponse.text(),
							bottomMarginPercent,
						),
						0.88,
					);
					const { default: JASSUB } = await import(
						`${playerAssetBase}/vendor/jassub/jassub.js?v=${jassubAssetVersion}`
					);
					const subtitleFontUrl =
						`${playerAssetBase}/fonts/vag-rounded-next-bold.woff2`;
					const renderer = new JASSUB({
						video,
						subContent,
						workerUrl:
							`${playerAssetBase}/vendor/jassub/jassub-worker.js?v=${jassubAssetVersion}`,
						wasmUrl:
							`${playerAssetBase}/vendor/jassub/jassub-worker.wasm?v=${jassubAssetVersion}`,
						modernWasmUrl:
							`${playerAssetBase}/vendor/jassub/jassub-worker-modern.wasm?v=${jassubAssetVersion}`,
						availableFonts: {
							"vag rounded next": subtitleFontUrl,
							tahoma: subtitleFontUrl,
							georgia: subtitleFontUrl,
						},
						defaultFont: "vag rounded next",
						queryFonts: false,
					});

					assSubtitles.renderer = renderer;
					renderer._canvas.style.visibility = "hidden";
					renderer._canvas.setAttribute("aria-hidden", "true");
					await renderer.ready;
					await applyBottomAssStyleMargin(
						renderer,
						subContent,
						bottomMarginPercent,
					);
					await applyResponsiveAssStyles(renderer, subContent, video);
					await raiseBottomAssEventMargins(
						renderer,
						subContent,
						bottomMarginPercent,
					);
					assSubtitles.resizeObserver = new ResizeObserver(() => {
						scheduleResponsiveAssStyles(renderer, subContent, video);
					});
					assSubtitles.resizeObserver.observe(video);
					assSubtitles.ready = true;
					assSubtitles.status = "ready";
					syncAssSubtitleVisibility(player);

					["texttrackvisibility", "textchanged", "trackschanged"].forEach(
						(eventName) => {
							player.addEventListener(eventName, () => {
								syncAssSubtitleVisibility(player);
							});
						},
					);
				} catch (error) {
					console.warn(
						"ASS subtitles unavailable; using WebVTT fallback.",
						error,
					);
					document
						.getElementById("player-container")
						.classList.remove("ass-subtitles-active");
					assSubtitles.ready = false;
					assSubtitles.status = "error";
					assSubtitles.error = String(error?.message || error).slice(0, 120);
					const renderer = assSubtitles.renderer;
					assSubtitles.renderer = null;
					assSubtitles.resizeObserver?.disconnect();
					assSubtitles.resizeObserver = null;
					clearTimeout(assSubtitles.resizeTimerId);
					assSubtitles.resizeTimerId = null;
					if (renderer) {
						await renderer.destroy().catch(() => {});
					}
					updateSubtitleDebugLabel(player);
				}
			}
			function normalizeMetricLabel(value) {

			function scheduleViewStartedMetricCheck() {

					(viewStartedMetric.thresholdSeconds -

				if (viewStartedMetric.sent) return;

					player &&

					player.isTextTrackVisible()
				) {
					return true;
				}

					? Array.from(video.textTracks)

			function sendSubtitleMetric() {
				if (subtitleMetric.sent) return;
				clearSubtitleMetricTimer();

				const queued = sendJsonMetric("subtitles", {
					seconds: Math.floor(getSubtitleMetricSeconds()),
					season: metricDatas.season,
					episode: metricDatas.episode,
				});
				if (queued) {
					subtitleMetric.sent = true;

						updateSubtitleMetricState,

				}

			function scheduleSubtitleMetricCheck() {
				clearSubtitleMetricTimer();
				if (subtitleMetric.sent || !subtitleMetric.activeStartedAt) {
					return;
				}

				const remainingMs = Math.max(
					0,
					(subtitleMetric.thresholdSeconds -
						getSubtitleMetricSeconds()) *

				subtitleMetric.timerId = setTimeout(() => {
					updateSubtitleMetricState();

				const shouldTrack =

					areSubtitlesVisible(metricPlayer, metricVideo);

				if (shouldTrack && !subtitleMetric.activeStartedAt) {

				if (!shouldTrack && subtitleMetric.activeStartedAt) {
					subtitleMetric.activeSeconds = getSubtitleMetricSeconds();

					showPlayerFeedback(getZoomLabel());
				const normalizeVideoScale = (nextScale) => {
					zoomState.coverScale = calculateCoverScale();
					const maxScale = Math.max(3, zoomState.coverScale * 2);
					let scale = Math.min(maxScale, Math.max(1, nextScale));
					if (Math.abs(scale - 1) < 0.04) scale = 1;
					if (Math.abs(scale - zoomState.coverScale) < 0.06) {
						scale = zoomState.coverScale;
					}
					return scale;
				};
				const setVideoZoom = (
					nextScale,
					showFeedback = true,
					force = false,
					nextPan = null,
				) => {
					if (!force && !isZoomAllowed()) return;
					const scale = normalizeVideoScale(nextScale);
					zoomState.scale = scale;
					zoomState.mode =
						scale <= 1.01
							? "fit"
							: Math.abs(scale - zoomState.coverScale) < 0.015
								? "cover"
								: "manual";
					container.style.setProperty(
						"--video-zoom",
						scale.toFixed(4),
					);
					if (scale <= 1.01) {
						setVideoPan(0, 0, scale);
					} else if (nextPan) {
						setVideoPan(nextPan.x, nextPan.y, scale);
					} else {
						setVideoPan(zoomState.panX, zoomState.panY, scale);
					}
					if (showFeedback) showZoomFeedback();
				};
				const adjustVideoZoom = (direction) => {
					if (!isZoomAllowed()) return;
					zoomState.coverScale = calculateCoverScale();
					if (direction > 0 && zoomState.scale <= 1.01) {
						setVideoZoom(
							zoomState.coverScale > 1.01
								? zoomState.coverScale
								: 1.1,
						);
						return;
					}
					if (
						direction < 0 &&
						zoomState.scale > zoomState.coverScale &&
						zoomState.scale - 0.1 <= zoomState.coverScale + 0.06
					) {
						setVideoZoom(zoomState.coverScale);
						return;
					}
					if (
						direction < 0 &&
						Math.abs(zoomState.scale - zoomState.coverScale) < 0.015
					) {
						setVideoZoom(1);
						return;
					}
					setVideoZoom(zoomState.scale + direction * 0.1);
				};
				const syncFullscreenZoom = () => {
					const fullscreen = isPlayerFullscreen();
					closeMobileContextMenu();
					zoomState.coverScale = calculateCoverScale();
					if (!fullscreen && !isTouchZoomDevice) {
						setVideoZoom(1, false, true);
						zoomFeedback.classList.remove("visible");
					}
				};
				const syncZoomAfterResize = () => {
					if (!isZoomAllowed()) return;
					const wasCover = zoomState.mode === "cover";
					zoomState.coverScale = calculateCoverScale();
					if (wasCover) {
						setVideoZoom(zoomState.coverScale, false);
					} else {
						setVideoPan(zoomState.panX, zoomState.panY);
					}
				};
				document.addEventListener("fullscreenchange", syncFullscreenZoom);
				document.addEventListener(
					"webkitfullscreenchange",
					syncFullscreenZoom,
				);
				window.addEventListener("resize", syncZoomAfterResize);
				video.addEventListener("loadedmetadata", syncZoomAfterResize);
				container.addEventListener(
					"wheel",
					(event) => {
						if (!isPlayerFullscreen()) return;
						event.preventDefault();
						adjustVideoZoom(event.deltaY < 0 ? 1 : -1);
					},
					{ passive: false },
				);
				const getTouchDistance = (touches) =>
					Math.hypot(
						touches[0].clientX - touches[1].clientX,
						touches[0].clientY - touches[1].clientY,
					);
				const isTouchOnControls = (target) =>
					target instanceof Element &&
					Boolean(
						target.closest(
							"button, input, select, #mobile-context-menu, .shaka-controls-button-panel, .shaka-seek-bar-container, .shaka-overflow-menu, .shaka-settings-menu",
						),
					);
				const toggleTouchControls = () => {
					const uiIsForcedHidden = container.classList.contains(
						"touch-controls-hidden",
					);
					const uiIsVisible =
						!uiIsForcedHidden &&
						(typeof controls.isOpaque === "function"
							? controls.isOpaque()
							: container
									.querySelector(".shaka-controls-container")
									?.getAttribute("shown") === "true");
					if (uiIsVisible) {
						clearTimeout(zoomState.controlsAnimationTimer);
						container.classList.add("touch-controls-hidden");
						zoomState.controlsAnimationTimer = setTimeout(() => {
							controls.hideUI?.();
						}, 200);
					} else {
						clearTimeout(zoomState.controlsAnimationTimer);
						controls.showUI?.();
						requestAnimationFrame(() => {
							container.classList.remove(
								"touch-controls-hidden",
							);
						});
					}
				};
				const clearLongPress = () => {
					clearTimeout(zoomState.longPressTimer);
					zoomState.longPressTimer = null;
				};
				const closeMobileContextMenu = () => {
					mobileContextMenu.classList.remove("visible");
				};
				const updateMobileContextMenu = () => {
					mobileContextLoop.classList.toggle("active", video.loop);
					mobileContextLoop.textContent = video.loop
						? "\u2713 \u041f\u043e\u0432\u0442\u043e\u0440"
						: "\u041f\u043e\u0432\u0442\u043e\u0440";
					mobileContextPip.disabled = !(
						document.pictureInPictureEnabled &&
						typeof video.requestPictureInPicture === "function"
					);
				};
				const openMobileContextMenu = (point) => {
					updateMobileContextMenu();
					mobileContextMenu.classList.add("visible");
					const bounds = container.getBoundingClientRect();
					requestAnimationFrame(() => {
						const margin = 12;
						const left = Math.min(
							bounds.width -
								mobileContextMenu.offsetWidth -
								margin,
							Math.max(
								margin,
								point.x - bounds.left,
							),
						);
						const top = Math.min(
							bounds.height -
								mobileContextMenu.offsetHeight -
								margin,
							Math.max(
								margin,
								point.y - bounds.top,
							),
						);
						mobileContextMenu.style.left = `${left}px`;
						mobileContextMenu.style.top = `${top}px`;
					});
				};
				const saveCurrentVideoFrame = () => {
					if (!video.videoWidth || !video.videoHeight) {
						showPlayerFeedback(
							"\u041a\u0430\u0434\u0440 \u0435\u0449\u0435 \u043d\u0435 \u0437\u0430\u0433\u0440\u0443\u0436\u0435\u043d",
						);
						return;
					}
					try {
						const canvas = document.createElement("canvas");
						canvas.width = video.videoWidth;
						canvas.height = video.videoHeight;
						canvas
							.getContext("2d")
							.drawImage(video, 0, 0, canvas.width, canvas.height);
						canvas.toBlob((blob) => {
							if (!blob) {
								showPlayerFeedback(
									"\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043a\u0430\u0434\u0440",
								);
								return;
							}
							const url = URL.createObjectURL(blob);
							const link = document.createElement("a");
							link.href = url;
							link.download = `dcote-frame-${Math.floor(
								video.currentTime * 1000,
							)}.png`;
							document.body.appendChild(link);
							link.click();
							link.remove();
							setTimeout(() => URL.revokeObjectURL(url), 1000);
							showPlayerFeedback(
								"\u041a\u0430\u0434\u0440 \u0441\u043e\u0445\u0440\u0430\u043d\u0435\u043d",
							);
						}, "image/png");
					} catch (error) {
						console.error("Unable to save video frame:", error);
						showPlayerFeedback(
							"\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u044c \u043a\u0430\u0434\u0440",
						);
					}
				};
				mobileContextLoop.addEventListener("click", (event) => {
					event.stopPropagation();
					video.loop = !video.loop;
					closeMobileContextMenu();
					showPlayerFeedback(
						video.loop
							? "\u041f\u043e\u0432\u0442\u043e\u0440 \u0432\u043a\u043b\u044e\u0447\u0435\u043d"
							: "\u041f\u043e\u0432\u0442\u043e\u0440 \u0432\u044b\u043a\u043b\u044e\u0447\u0435\u043d",
					);
				});
				mobileContextPip.addEventListener("click", async (event) => {
					event.stopPropagation();
					closeMobileContextMenu();
					try {
						if (document.pictureInPictureElement) {
							await document.exitPictureInPicture();
						} else {
							await video.requestPictureInPicture();
						}
					} catch (error) {
						console.error("Unable to toggle picture-in-picture:", error);
						showPlayerFeedback(
							"\u041a\u0430\u0440\u0442\u0438\u043d\u043a\u0430 \u0432 \u043a\u0430\u0440\u0442\u0438\u043d\u043a\u0435 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0430",
						);
					}
				});
				mobileContextSaveFrame.addEventListener("click", (event) => {
					event.stopPropagation();
					closeMobileContextMenu();
					saveCurrentVideoFrame();
				});
				container.addEventListener("contextmenu", (event) => {
					if (isTouchZoomDevice) event.preventDefault();
				});
				container.addEventListener(
					"touchstart",
					(event) => {
						if (!isZoomAllowed()) {
							return;
						}
						clearLongPress();
						zoomState.longPressTriggered = false;
						const closedContextMenu =
							mobileContextMenu.classList.contains("visible") &&
							!(
								event.target instanceof Element &&
								event.target.closest("#mobile-context-menu")
							);
						if (closedContextMenu) {
							closeMobileContextMenu();
						}
						const touchStartedOnControls = isTouchOnControls(
							event.target,
						);
						const shouldCaptureTouch =
							event.touches.length > 1 ||
							!touchStartedOnControls;
						if (shouldCaptureTouch) {
							event.preventDefault();
							event.stopPropagation();
							event.stopImmediatePropagation();
							zoomState.touchGestureCaptured = true;
						}
						if (event.touches.length === 1) {
							zoomState.tapStartPoint = {
								x: event.touches[0].clientX,
								y: event.touches[0].clientY,
							};
							zoomState.tapStartTime = performance.now();
							zoomState.tapMoved = false;
							zoomState.tapStartedOnControls =
								touchStartedOnControls || closedContextMenu;
							if (
								!touchStartedOnControls &&
								!closedContextMenu
							) {
								const longPressPoint = {
									x: event.touches[0].clientX,
									y: event.touches[0].clientY,
								};
								zoomState.longPressTimer = setTimeout(() => {
									if (
										zoomState.tapStartPoint &&
										!zoomState.tapMoved &&
										!zoomState.pinchStartDistance
									) {
										zoomState.longPressTriggered = true;
										zoomState.tapMoved = true;
										navigator.vibrate?.(20);
										openMobileContextMenu(longPressPoint);
									}
								}, 600);
							}
						} else {
							zoomState.tapStartPoint = null;
							clearLongPress();
						}
						if (
							event.touches.length === 1 &&
							zoomState.scale > 1.01 &&
							!isTouchOnControls(event.target)
						) {
							event.preventDefault();
							container.classList.add("video-zoom-gesturing");
							zoomState.panStartPoint = {
								x: event.touches[0].clientX,
								y: event.touches[0].clientY,
							};
							zoomState.panStartX = zoomState.panX;
							zoomState.panStartY = zoomState.panY;
							return;
						}
						if (event.touches.length !== 2) return;
						event.preventDefault();
						container.classList.add("video-zoom-gesturing");
						zoomState.panStartPoint = null;
						zoomState.pinchStartDistance = getTouchDistance(
							event.touches,
						);
						zoomState.pinchStartScale = zoomState.scale;
						zoomState.pinchStartCenter = getContainerCenterOffset(
							getTouchCenter(event.touches),
						);
						zoomState.pinchStartPanX = zoomState.panX;
						zoomState.pinchStartPanY = zoomState.panY;
					},
					{ passive: false, capture: true },
				);
				container.addEventListener(
					"touchmove",
					(event) => {
						if (
							zoomState.tapStartPoint &&
							event.touches.length > 0
						) {
							const tapDistance = Math.hypot(
								event.touches[0].clientX -
									zoomState.tapStartPoint.x,
								event.touches[0].clientY -
									zoomState.tapStartPoint.y,
							);
							if (tapDistance > 8) {
								zoomState.tapMoved = true;
								clearLongPress();
							}
						}
						if (
							zoomState.panStartPoint &&
							event.touches.length === 1
						) {
							event.preventDefault();
							const distance = Math.hypot(
								event.touches[0].clientX -
									zoomState.panStartPoint.x,
								event.touches[0].clientY -
									zoomState.panStartPoint.y,
							);
							if (distance > 8) zoomState.tapMoved = true;
							setVideoPan(
								zoomState.panStartX +
									event.touches[0].clientX -
									zoomState.panStartPoint.x,
								zoomState.panStartY +
									event.touches[0].clientY -
									zoomState.panStartPoint.y,
							);
							return;
						}
						if (
							!zoomState.pinchStartDistance ||
							event.touches.length !== 2
						) {
							return;
						}
						event.preventDefault();
						zoomState.tapMoved = true;
						clearLongPress();
						const distance = getTouchDistance(event.touches);
						const nextScale = normalizeVideoScale(
							zoomState.pinchStartScale *
								(distance / zoomState.pinchStartDistance),
						);
						const scaleRatio =
							nextScale / zoomState.pinchStartScale;
						const currentCenter = getContainerCenterOffset(
							getTouchCenter(event.touches),
						);
						setVideoZoom(
							nextScale,
							false,
							false,
							{
								x:
									currentCenter.x -
									(zoomState.pinchStartCenter.x -
										zoomState.pinchStartPanX) *
										scaleRatio,
								y:
									currentCenter.y -
									(zoomState.pinchStartCenter.y -
										zoomState.pinchStartPanY) *
										scaleRatio,
							},
						);
					},
					{ passive: false, capture: true },
				);
				const finishTouchZoom = (event) => {
					clearLongPress();
					if (
						event.touches.length === 1 &&
						zoomState.pinchStartDistance
					) {
						event.preventDefault();
						event.stopPropagation();
						event.stopImmediatePropagation();
						zoomState.pinchStartDistance = null;
						zoomState.pinchStartCenter = null;
						zoomState.panStartPoint = {
							x: event.touches[0].clientX,
							y: event.touches[0].clientY,
						};
						zoomState.panStartX = zoomState.panX;
						zoomState.panStartY = zoomState.panY;
						setVideoZoom(zoomState.scale);
						return;
					}
					if (event.touches.length > 0) return;
					const wasPinching = Boolean(zoomState.pinchStartDistance);
					const wasTap =
						event.type === "touchend" &&
						zoomState.tapStartPoint &&
						!zoomState.tapMoved &&
						!zoomState.longPressTriggered &&
						!zoomState.tapStartedOnControls &&
						performance.now() - zoomState.tapStartTime < 350;
					zoomState.pinchStartDistance = null;
					zoomState.pinchStartCenter = null;
					zoomState.panStartPoint = null;
					zoomState.tapStartPoint = null;
					zoomState.longPressTriggered = false;
					container.classList.remove("video-zoom-gesturing");
					if (wasPinching) setVideoZoom(zoomState.scale);
					if (zoomState.touchGestureCaptured) {
						event.preventDefault();
						event.stopPropagation();
						event.stopImmediatePropagation();
						zoomState.touchGestureCaptured = false;
					}
					if (wasTap) {
						toggleTouchControls();
					}
				};
				container.addEventListener("touchend", finishTouchZoom, true);
				container.addEventListener("touchcancel", finishTouchZoom, true);

				const localization = controls.getLocalization();
				const RU = "ru";
				localization.insert(
					RU,
					new Map([
						["PLAY", "Воспроизвести"],
						["PAUSE", "Пауза"],
						["REPLAY", "Повторить"],
						["MUTE", "Выключить звук"],
						["UNMUTE", "Включить звук"],
						["FULL_SCREEN", "Полный экран"],
						["EXIT_FULL_SCREEN", "Выйти"],
						["ENTER_PICTURE_IN_PICTURE", "Картинка в картинке"],
						["MORE_SETTINGS", "Настройки"],
						["CAPTIONS", "Субтитры"],
						["LOOP", "Повтор"],
						["PLAYBACK_RATE", "Скорость"],
						["QUALITY", "Качество"],
						["AUTO_QUALITY", "Авто"],
						["RESOLUTION", "Разрешение"],
						["OFF", "Выкл"],
						["LANGUAGE", "Озвучка"],
					]),
				);
				localization.changeLocale([RU]);

				window.addEventListener("keydown", (e) => {
					if (
						["INPUT", "SELECT", "TEXTAREA"].includes(
							document.activeElement.tagName,
						)
					)
						return;
					switch (e.code) {
						case "Space":
						case "KeyK":
							e.preventDefault();
							video.paused ? video.play() : video.pause();
							break;
						case "ArrowRight":
							video.currentTime += 5;
							break;
						case "ArrowLeft":
							video.currentTime -= 5;
							break;
						case "ArrowUp":
							e.preventDefault();
							video.volume = Math.min(1, video.volume + 0.1);
							break;
						case "ArrowDown":
							e.preventDefault();
							video.volume = Math.max(0, video.volume - 0.1);
							break;
						case "KeyM":
							video.muted = !video.muted;
							break;
						case "Equal":
						case "NumpadAdd":
							if (isPlayerFullscreen()) {
								e.preventDefault();
								adjustVideoZoom(1);
							}
							break;
						case "Minus":
						case "NumpadSubtract":
							if (isPlayerFullscreen()) {
								e.preventDefault();
								adjustVideoZoom(-1);
							}
							break;
						case "Digit0":
						case "Numpad0":
							if (isPlayerFullscreen()) {
								e.preventDefault();
								setVideoZoom(1);
							}
							break;
						case "KeyF":
							controls.toggleFullScreen();
							break;
					}
				});

				const shakaButtons = container.querySelectorAll(
					"button, .shaka-range-element",
				);
				shakaButtons.forEach((btn) => {
					btn.addEventListener("click", () => {
						btn.blur();
					});
				});

				const skipAction = document.getElementById("skip-btn-action");
				const skipDismiss = document.getElementById("skip-btn-dismiss");
				const skipTarget =
					skipEnd > skipStart && skipEnd >= 0
						? skipEnd
						: skipStart + 85;

				let skipDismissed = false;

				video.addEventListener("timeupdate", () => {
					const isInsideRange =
						video.currentTime > skipStart &&
						video.currentTime < skipTarget &&
						skipStart >= 0;
					const overflowMenu = document.querySelector(
						".shaka-overflow-menu",
					);
					const isMenuOpen =
						overflowMenu &&
						!overflowMenu.classList.contains("shaka-hidden");
					if (isInsideRange && !skipDismissed && !isMenuOpen) {
						skipBtn.classList.add("visible");
					} else {
						skipBtn.classList.remove("visible");
					}
				});

				const silenceShaka = (e) => {
					e.stopPropagation();
					e.stopImmediatePropagation();
					if (
						controls &&
						typeof controls.setEnabledShakaControls === "function"
					) {
						controls.setEnabledShakaControls(false);
						setTimeout(
							() => controls.setEnabledShakaControls(true),
							400,
						);
					}
				};

				["pointerdown", "touchstart", "mousedown"].forEach((type) => {
					skipBtn.addEventListener(type, silenceShaka, true);
				});

				skipAction.addEventListener(
					"click",
					(e) => {
						e.stopPropagation();
						e.stopImmediatePropagation();
						video.currentTime = skipTarget;
						skipBtn.classList.remove("visible");
						if (controls && typeof controls.hideUI === "function") {
							controls.hideUI();
						}
					},
					true,
				);

				skipDismiss.addEventListener(
					"click",
					(e) => {
						e.stopPropagation();
						e.stopImmediatePropagation();
						skipDismissed = true;
						skipBtn.classList.remove("visible");
						if (controls && typeof controls.hideUI === "function") {
							controls.hideUI();
						}
					},
					true,
				);

				const overflowBtn = document.querySelector(
					".shaka-overflow-menu-button",
				);
				if (overflowBtn) {
					overflowBtn.addEventListener("click", () => {
						skipBtn.classList.remove("visible");
					});
				}

				if (src) {
					if (assUrl) {
						initAssSubtitles(
							player,
							video,
							assUrl,
							assBottomMarginPercent,
						);
					}
					try {
						await player.load(src);
						showPoster();
						initMetricDatas(src);
						initAudioMetricTracking(player);
						initSubtitleMetricTracking(player, video);
					} catch (e) {
						onError(e);
					}
				}
			}
			window.addEventListener("pagehide", () => {
				assSubtitles.resizeObserver?.disconnect();
				clearTimeout(assSubtitles.resizeTimerId);
				assSubtitles.renderer?.destroy().catch(() => {});
			});
			document.addEventListener("DOMContentLoaded", init);
		</script>
	</body>
</html>
