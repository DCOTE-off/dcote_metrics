apiVersion: 1

datasources:
    - name: Prometheus
      uid: PBFA97CFB590B2093
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
    - name: Dcote analytics
      uid: dcote-analytics
      type: prometheus
      access: proxy
      url: http://backend:3000/analytics
      isDefault: false
      jsonData:
          httpMethod: POST
          manageAlerts: false
          prometheusType: Prometheus
          prometheusVersion: 3.0.0
          timeInterval: 5s
          httpHeaderName1: Authorization
      secureJsonData:
          httpHeaderValue1: "Bearer $__file{/run/secrets/metrics_auth_token}"
